version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aviai-backend
    ports:
      - "8000:8000"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      OLLAMA_MODEL_URL: http://host.docker.internal:11434
      OLLAMA_MODEL_NAME: gemma3
      RECORDING_DB_URL: /recordings
      LLM_PROVIDER: ${LLM_PROVIDER}
      # Chat/text LLM — routed through the RMIT Val gateway.
      RMIT_VAL_API_KEY: ${RMIT_VAL_API_KEY}
      RMIT_VAL_BASE_URL: ${RMIT_VAL_BASE_URL}
      RMIT_VAL_MODEL: ${RMIT_VAL_MODEL}
      TTS_VOICE: ${TTS_VOICE}
    volumes:
      - ./src/agent/conversation:/app/src/agent/conversation
      - ./recordings:/recordings
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
