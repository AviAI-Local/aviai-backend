version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aviai-backend
    ports:
      - "8000:8000"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      OLLAMA_MODEL_URL: http://host.docker.internal:11434
      OLLAMA_MODEL_NAME: gemma3
      RECORDING_DB_URL: /recordings
      LLM_PROVIDER: ${LLM_PROVIDER}
      # RMIT Val gateway is unreachable from Render (blocked at RMIT's network
      # edge) — left here, unused, in case access is restored later.
      RMIT_VAL_API_KEY: ${RMIT_VAL_API_KEY}
      RMIT_VAL_BASE_URL: ${RMIT_VAL_BASE_URL}
      RMIT_VAL_MODEL: ${RMIT_VAL_MODEL}
      # TTS/STT provider ("local" | "openrouter" | "openrouter-audio")
      TTS_STT_PROVIDER: ${TTS_STT_PROVIDER}
      TTS_VOICE: ${TTS_VOICE}
      # Chat/text LLM — routed through OpenRouter, plus OpenRouter's TTS/STT.
      OPENROUTER_MODEL_NAME: ${OPENROUTER_MODEL_NAME}
      OPENROUTER_AUDIO_MODEL: ${OPENROUTER_AUDIO_MODEL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL}
      OPENROUTER_STT_MODEL: ${OPENROUTER_STT_MODEL}
      OPENROUTER_TTS_MODEL: ${OPENROUTER_TTS_MODEL}
      OPENROUTER_TTS_SAMPLE_RATE: ${OPENROUTER_TTS_SAMPLE_RATE}
    volumes:
      - ./recordings:/recordings
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
